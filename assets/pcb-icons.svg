<svg xmlns="http://www.w3.org/2000/svg">
<!-- PCB 3D Builder page icons. Same line style as the main page process icons:
     44×44 grid, 2px stroke, round caps/joins, color from currentColor. Decorative only (use aria-hidden). -->
<defs>
  <!-- Board file input: document + arrow in -->
  <symbol id="i-file" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6h14l7 7v25H12z"/><path d="M26 6v7h7"/><path d="M22.5 18v12M17.5 25l5 5 5-5"/></g></symbol>
  <!-- Board outline with mounting holes -->
  <symbol id="i-board" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="11" width="32" height="22" rx="3"/><circle cx="11" cy="16" r="1.6"/><circle cx="33" cy="16" r="1.6"/><circle cx="11" cy="28" r="1.6"/><circle cx="33" cy="28" r="1.6"/></g></symbol>
  <!-- Parts placed on a board -->
  <symbol id="i-parts" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="32" height="26" rx="3"/><rect x="11" y="15" width="10" height="8"/><rect x="25" y="21" width="8" height="9"/><path d="M13 13v2M19 13v2M13 23v2M19 23v2"/></g></symbol>
  <!-- Datasheet PDF dimension -> part -->
  <symbol id="i-pdf" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h14l7 7v25H10z"/><path d="M24 6v7h7"/><path d="M15 25h11M15 25l3-3M15 25l3 3M26 25l-3-3M26 25l-3 3"/><path d="M15 31h6"/></g></symbol>
  <!-- Position / orientation adjustment: part over its pad with move arrows -->
  <symbol id="i-adjust" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="15" width="14" height="14" rx="1.5"/><path d="M22 5v6M19 8l3-3 3 3M22 39v-6M19 36l3 3 3-3M5 22h6M8 19l-3 3 3 3M39 22h-6M36 19l3 3-3 3"/></g></symbol>
  <!-- Board preview: top / bottom and side views (flat projections) -->
  <symbol id="i-views" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="22" height="16" rx="2"/><rect x="16" y="21" width="22" height="16" rx="2"/><path d="M6 30h6M38 14h-6"/></g></symbol>
  <!-- Board surface layers (silkscreen / copper) -->
  <symbol id="i-layers" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 8l15 7-15 7-15-7z"/><path d="M7 22l15 7 15-7"/><path d="M7 29l15 7 15-7"/></g></symbol>
  <!-- Height limit check: ruler, part, limit line -->
  <symbol id="i-height" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7v30M10 7h5M10 13h3M10 19h5M10 25h3M10 31h5"/><rect x="21" y="19" width="14" height="18" rx="1.5"/><path d="M18 14h20" stroke-dasharray="3 3"/></g></symbol>
  <!-- Spreadsheet report -->
  <symbol id="i-report" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="28" height="28" rx="2"/><path d="M8 16h28M8 24h28M18 8v28"/></g></symbol>
  <!-- Save results -->
  <symbol id="i-save" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7v19M15 19l7 7 7-7"/><path d="M8 29v7h28v-7"/></g></symbol>
  <!-- Part 3D model / STEP -->
  <symbol id="i-cube" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6l14 8v16l-14 8-14-8V14z"/><path d="M8 14l14 8 14-8M22 22v16"/></g></symbol>
  <!-- Parts list (BOM) -->
  <symbol id="i-list" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 12h19M17 22h19M17 32h19"/><circle cx="10" cy="12" r="1.6"/><circle cx="10" cy="22" r="1.6"/><circle cx="10" cy="32" r="1.6"/></g></symbol>
  <!-- Shared team library folder -->
  <symbol id="i-library" viewBox="0 0 44 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15h12l3 4h17v17H6z"/><path d="M10 11h10l3 4"/><path d="M16 28h12"/></g></symbol>
</defs>
</svg>
