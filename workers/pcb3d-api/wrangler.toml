# PCB 3D Builder 다운로드 서버 (Cloudflare Worker + D1). 설명: docs/PCB3D-DOWNLOAD.md
name = "pcb3d-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# 매일 03:00(KST) 보유 기간이 지난 개인정보와 오래된 코드를 지움
[triggers]
crons = ["0 18 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pcb3d"
# 2026-10-18 생성 (APAC). 로컬 시험(wrangler dev)은 별도의 로컬 DB를 씁니다.
database_id = "1cf8d412-73cd-4f65-96ad-54b77b4bafac"

[vars]
SITE_ORIGIN = "https://31ns.kr"
# 신청 API를 부를 수 있는 홈페이지 주소(쉼표 구분)
ALLOWED_ORIGINS = "https://31ns.kr,https://www.31ns.kr,http://localhost:8000,http://127.0.0.1:8000"
RELEASE_REPO = "promisesmk/PCB3D-Releases"
ADMIN_EMAIL = "nskim@31ns.kr"
# 메일 발신 주소(Resend에 31ns.kr 도메인 인증, 가비아 DNS 2026-10-18). 받은 사람이 답장하면 ADMIN_EMAIL로 감
MAIL_FROM = "31NS-Tech <noreply@31ns.kr>"
CODE_TTL_MINUTES = "10"
RETENTION_DAYS = "365"
# 새 버전 안내: 관리자 미리보기 메일 뒤 이 시간이 지난 다음 새벽 점검 때 자동 발송(매일 03:00 점검이라 실제로는 하루 뒤)
NOTICE_DELAY_HOURS = "20"
# 자동 발송 메일의 수신 거부 · 취소 링크에 쓰는 이 서버 주소
WORKER_ORIGIN = "https://pcb3d-api.31ns-tech.workers.dev"

# 비밀값(이 파일에 쓰지 않음) — `npx wrangler secret put <이름>`으로 입력
#   GITHUB_TOKEN      비공개 저장소 PCB3D-Releases 읽기 토큰
#   TURNSTILE_SECRET  Cloudflare Turnstile 비밀 키
#   RESEND_API_KEY    알림 메일 발송(Resend) 키
#   ADMIN_SECRET      관리 링크 서명 · 관리 화면 비밀번호(길고 무작위인 값)
# 로컬 시험용 값은 .dev.vars(커밋 안 함)에 넣습니다. 예시: .dev.vars.example
