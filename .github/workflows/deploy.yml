name: Deploy 31NS Website to GitHub Pages

on:
  # push로는 배포되지 않습니다. 대표님이 [Run workflow]를 누를 때, 그리고 매일 03:00(KST)에 main을 배포합니다.
  workflow_dispatch:
  # 매일 자동 배포 — 승인한 PCB 3D Builder Q&A를 다음 날 아침 공개하기 위함 (main에 이미 반영된 내용만 나감)
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write   # 배포 이력 태그(deploy-*) 생성용
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # main 브랜치에서 실행할 때만 배포 — develop/redesign 브랜치를 실수로 선택해도 실제 사이트는 바뀌지 않습니다.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 빌드 도구 없는 정적 사이트 — 공개할 파일만 _site로 모읍니다(문서 · 시험 · 서버 코드 · 도구는 제외).
      - name: Collect Site Files
        run: |
          rsync -a --exclude-from=- ./ _site/ <<'EOF'
          .git/
          .github/
          _site/
          docs/
          tests/
          tools/
          workers/
          node_modules/
          scratch/
          .gitignore
          package.json
          package-lock.json
          EOF

      # 3D 사옥 — 별도 저장소 promisesmk/31ns-3d-hq(main)의 파일을 /3d/에 함께 올립니다. 코드는 이 저장소에 들어오지 않습니다.
      # 읽기 전용 배포 키(비밀값 HQ3D_DEPLOY_KEY)가 없거나, 저장소 변수 HQ3D_ENABLED가 false이거나, 받기에 실패하면
      # 3D 없이 2D만 배포합니다. 이때 메인의 "3D 사옥 둘러보기" 버튼도 꺼진 채로 나가므로(data-hq3d="off") 없는 페이지로 가지 않습니다.
      - name: Add 3D HQ (/3d/)
        env:
          HQ3D_KEY: ${{ secrets.HQ3D_DEPLOY_KEY }}
          HQ3D_ENABLED: ${{ vars.HQ3D_ENABLED }}
        run: |
          if [ -z "$HQ3D_KEY" ] || [ "$HQ3D_ENABLED" = "false" ]; then
            echo "3D 사옥 건너뜀 (배포 키 없음 또는 HQ3D_ENABLED=false)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          install -m 700 -d ~/.ssh
          # 웹 화면에 붙여넣은 키는 줄바꿈이 CRLF로 바뀌거나 앞뒤 공백이 붙을 수 있어 정리한 뒤 씀
          printf '%s\n' "$HQ3D_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/hq3d && chmod 600 ~/.ssh/hq3d
          ssh-keygen -y -f ~/.ssh/hq3d > /dev/null || echo "::warning::HQ3D_DEPLOY_KEY 형식을 읽지 못했습니다"
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          if GIT_SSH_COMMAND="ssh -i ~/.ssh/hq3d -o IdentitiesOnly=yes" git clone -q --depth 1 git@github.com:promisesmk/31ns-3d-hq.git /tmp/hq3d \
             && [ -f /tmp/hq3d/index.html ]; then
            rsync -a --exclude .git --exclude tools/ --exclude README.md --exclude package.json --exclude .gitignore /tmp/hq3d/ _site/3d/
            sed -i 's/data-hq3d="off"/data-hq3d="on"/g' _site/index.html
            echo "3D 사옥 포함: $(git -C /tmp/hq3d log --oneline -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::3D 사옥 저장소를 받지 못해 건너뜁니다(2D는 그대로 배포)"
          fi
          rm -f ~/.ssh/hq3d

      # 브라우저 캐시 갱신 — 페이지가 부르는 assets/의 .js · .css 주소 끝에 ?v=커밋번호를 붙여, 배포 직후에도 새 파일을 받게 합니다.
      - name: Version Asset URLs
        run: |
          python3 - <<'EOF'
          import os, re
          ver = os.environ['GITHUB_SHA'][:7]
          pattern = re.compile(r'((?:src|href)="(?:\.\./)*/?assets/[^"?#]+\.(?:js|css))"')
          for root, _, files in os.walk('_site'):
              for name in files:
                  if name.endswith('.html'):
                      path = os.path.join(root, name)
                      s = open(path, encoding='utf-8').read()
                      t = pattern.sub(rf'\1?v={ver}"', s)
                      if t != s:
                          open(path, 'w', encoding='utf-8').write(t)
          EOF

      # 승인된 PCB 3D Builder Q&A를 정적 페이지로 생성 (저장소 변수 PCB3D_API가 없거나 서버 오류면 건너뜀)
      - name: Build Q&A Pages
        env:
          PCB3D_API: ${{ vars.PCB3D_API }}
        run: python3 tools/build_qna.py _site

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 배포 이력 기록 — 배포된 커밋에 deploy-YYYYMMDD-HHMM(KST) 태그를 남겨, 언제 어떤 버전이 올라갔는지 git에서 확인할 수 있습니다.
      # 매일 자동 배포는 태그를 남기지 않음(수동 배포만 기록 — 태그가 매일 쌓이지 않게)
      - name: Tag Deployed Commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="deploy-$(TZ=Asia/Seoul date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "31ns.kr 배포 (${GITHUB_ACTOR})"
          git push origin "$TAG"
          {
            echo "### 배포 완료"
            echo "- 태그: \`$TAG\`"
            echo "- 커밋: \`${GITHUB_SHA::7}\` $(git log -1 --format=%s)"
            echo "- 실행자: ${GITHUB_ACTOR}"
            echo "- 주소: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
